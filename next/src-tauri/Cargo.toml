[package]
name = "yui-live-kit"
version = "2026.1108.1"
description = "YuiLiveKit rewritten on Tauri (M0 prototype)"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }

[profile.release]
opt-level = "s"
lto = "thin"  # fat LTO crashes rustc 1.99.1 (0xc0000005) with this dependency set
codegen-units = 1
panic = "abort"
strip = true
