[package]
name = "yui-live-kit"
version = "2026.1108.4"
description = "YuiLiveKit rewritten on Tauri"
edition = "2021"
publish = false

[lib]
name = "yui_live_kit"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "io-util", "process"] }
tokio-util = "0.7"
tokio-native-tls = "0.3"
native-tls = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "gzip", "query", "stream"] }
rusqlite = { version = "0.41", features = ["bundled"] }
regex = "1"
url = "2"
futures-util = "0.3"
sha2 = "0.10"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "mp3", "vorbis", "symphonia-aac", "symphonia-isomp4"] }
keyring = "4"
tauri-plugin-dialog = "2"

[profile.release]
opt-level = "s"
lto = "thin"  # fat LTO crashes rustc 1.99.1 (0xc0000005) with this dependency set
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
